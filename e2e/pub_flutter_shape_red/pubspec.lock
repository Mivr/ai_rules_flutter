# Hand-written lock for the shape red path: the only resolved packages are
# the `bad_shape` and `bad_font` path packages, plus the Flutter SDK entry
# `flutter.pub` requires. The fixture never runs `dart pub get`; CI only
# fetches each spoke, which must fail on its malformed `flutter:` section
# before any hosted download could matter.
packages:
  bad_font:
    dependency: "direct main"
    description:
      path: "bad_font"
      relative: true
    source: path
    version: "0.1.0"
  bad_shape:
    dependency: "direct main"
    description:
      path: "bad_shape"
      relative: true
    source: path
    version: "0.1.0"
  flutter:
    dependency: "direct main"
    description: flutter
    source: sdk
    version: "0.0.0"
sdks:
  dart: ">=3.13.0 <4.0.0"
  flutter: ">=3.18.0-18.0.pre.54"
