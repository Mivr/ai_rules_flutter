name: bad_font
description: Red-path fixture path package with an invalid font weight.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

flutter:
  # Deliberately malformed: flutter_tools only accepts font weights
  # 100..900. The spoke fetch must fail with `Invalid value 150 ... for
  # font -> weight` at the `weight:` line instead of bundling the font
  # with an unset weight.
  fonts:
    - family: BadFont
      fonts:
        - asset: fonts/bad.ttf
          weight: 150
