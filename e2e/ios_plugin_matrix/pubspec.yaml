name: ios_plugin_matrix
publish_to: none

environment:
  sdk: ^3.13.0

# The real-plugin fetch matrix (POD-2). Every version is pinned to the one
# docs/design/cocoapods.md measured; a later item changes an expectation here,
# not a version.
dependencies:
  flutter:
    sdk: flutter
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  cloud_firestore: 7.1.0
  firebase_messaging: 17.0.1
  google_maps_flutter_ios: 2.18.7
  google_sign_in_ios: 6.3.8
  sentry_flutter: 10.2.0
  image_picker_ios: 0.8.13+14
  webview_flutter_wkwebview: 3.27.2
  url_launcher_ios: 6.4.2
  permission_handler_apple: 9.6.4
  flutter_inappwebview_ios: 1.1.2
  google_mlkit_commons: 0.13.0
  stripe_ios: 14.2.0
