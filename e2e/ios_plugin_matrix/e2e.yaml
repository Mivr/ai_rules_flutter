  - name: Android refusal on google_mlkit_commons
    run: bazel build @deps__google_mlkit_commons//android:lib
    expect:
      non_zero: true
      output_contains:
        - 'flutter.pub spoke for "google_mlkit_commons"'
        - declares Android dependencies rules_flutter cannot translate to Bazel labels
        - com.google.mlkit:vision-common
