      non_zero: true
      output_contains: 'Flutter plugin "google_mlkit_commons" depends on pod "MLKitVision" (10.0.0 in @@//:Podfile.lock), which no Bazel target provides. Map it with flutter.pub(ios_pod_deps = {"MLKitVision": "<label>"})'
