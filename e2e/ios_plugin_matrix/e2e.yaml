schema: mivr-e2e-spec/1
commands:
  - name: test workspace and matrix self-test
    run: bazel test //... --test_output=errors
    min_tests_executed: 2
  - name: query firebase_core spoke
    run: bazel query @deps__firebase_core//:all
    expect:
      non_zero: true
      output_contains: 'sets no `swift_package_resolved`'
  - name: query firebase_auth spoke
    run: bazel query @deps__firebase_auth//:all
    expect:
      non_zero: true
      output_contains: 'sets no `swift_package_resolved`'
  - name: query cloud_firestore spoke
    run: bazel query @deps__cloud_firestore//:all
    expect:
      non_zero: true
      output_contains: 'sets no `swift_package_resolved`'
  - name: query firebase_messaging spoke
    run: bazel query @deps__firebase_messaging//:all
    expect:
      non_zero: true
      output_contains: 'sets no `swift_package_resolved`'
  - name: query google_maps_flutter_ios spoke
    run: bazel query @deps__google_maps_flutter_ios//:all
  - name: query google_sign_in_ios spoke
