      non_zero: true
      output_contains: 'sets no `swift_package_resolved`'
  - name: query pods firebase_core spoke
    run: bazel query @deps_pods__firebase_core//:all
    expect:
      non_zero: true
      output_contains: 'Flutter plugin "firebase_core" depends on pod "Firebase/CoreOnly" (12.19.3 in @@//:Podfile.lock), which no Bazel target provides. Map it with flutter.pub(ios_pod_deps = {"Firebase/CoreOnly": "<label>"})'
  - name: query pods firebase_auth spoke
    run: bazel query @deps_pods__firebase_auth//:all
    expect:
      non_zero: true
      output_contains: 'Flutter plugin "firebase_auth" depends on pod "Firebase/Auth" (12.19.3 in @@//:Podfile.lock), which no Bazel target provides. Map it with flutter.pub(ios_pod_deps = {"Firebase/Auth": "<label>"})'
  - name: query pods cloud_firestore spoke
