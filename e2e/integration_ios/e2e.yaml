schema: mivr-e2e-spec/1
commands:
  - name: test all targets
    run: bazel test //... --test_output=errors
    min_tests_executed: 20
    expect:
      exit_code: 0
  - name: iOS simulator green test.xml
    run: bazel test //:app_test --test_output=errors
    expect:
      exit_code: 0
      test_xml_contains:
        - <testsuite name="integration_test/app_test.dart"
        - failures="0" errors="0"
  - name: iOS simulator red twin
    run: bazel test //:app_test_red --test_output=errors
    expect:
      non_zero: true
      output_contains: RED_TWIN_MUST_FAIL
      test_log_contains: RED_TWIN_MUST_FAIL
      test_xml_contains:
        - <testsuite name="integration_test/red_test.dart"
        - <failure
  - name: SwiftPM unpinned red path
    run: bazel query @deps_unpinned__spm_bigint_plugin//:all
    expect:
      non_zero: true
      output_contains:
        - 'Flutter plugin "spm_bigint_plugin"'
        - ios/spm_bigint_plugin/Package.swift
        - 'has no `swift_package_sha256["bigint"]` entry'
  - name: CocoaPods wrong-library probe
    run: bazel test //:plugin_pod_wrong_test --test_output=errors
    expect:
      non_zero: true
      test_xml_contains:
        - <testsuite name="integration_test/plugin_pod_test.dart"
        - <failure
  - name: CocoaPods unmapped pod red path
    run: bazel query @deps_pods_unmapped__pod_bigint_plugin//:all
    expect:
      non_zero: true
      output_contains:
        - 'Flutter plugin "pod_bigint_plugin" depends on pod "BigInt" (6.0.1 in '
        - ':ios/Podfile.lock), which no Bazel target provides. Map it with flutter.pub(ios_pod_deps = {"BigInt": "<label>"}) or declare it unneeded with flutter.pub(ios_pod_ignore = ["BigInt"]).'
