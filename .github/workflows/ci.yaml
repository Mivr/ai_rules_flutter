        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  # Fails when an e2e module's MODULE.bazel is in no workflow without a
  # one-line reason recorded in tools/check_e2e_coverage: removing a
  # workspace from every shard without saying why turns this red.
  e2e-coverage:
    name: E2E coverage check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Enable Linux sandbox user namespaces
        run: .github/scripts/enable_linux_sandbox.sh
      # Repository cache only (shared per OS, no disk-cache shard): this job
      # builds one tiny Dart tool, so it restores what ci.yaml saves and
      # never writes, like commit-messages.yaml.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      - name: Check every e2e module is covered or reasoned
        run: bazel run //tools/check_e2e_coverage
      - name: Check rules_android_maven pins in Android workspaces
        run: bazel run //tools/check_maven_pins
  reproducibility:
    name: Reproducibility canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Enable Linux sandbox user namespaces
        run: .github/scripts/enable_linux_sandbox.sh
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      - name: Verify canary output differs across distinct output bases
        working-directory: e2e/repro_canary
        run: |
          trap 'bazel --output_base="${RUNNER_TEMP}/repro_canary_a" shutdown; bazel --output_base="${RUNNER_TEMP}/repro_canary_b" shutdown' EXIT
          bazel "--output_base=${RUNNER_TEMP}/repro_canary_a" build //:canary
          if [ ! -s bazel-bin/canary.bin ]; then
            echo "e2e/repro_canary: output missing or empty in run A" >&2
            exit 1
          fi
          sum_a=$(sha256sum bazel-bin/canary.bin | awk '{print $1}')

          bazel "--output_base=${RUNNER_TEMP}/repro_canary_b" build //:canary
          if [ ! -s bazel-bin/canary.bin ]; then
            echo "e2e/repro_canary: output missing or empty in run B" >&2
            exit 1
          fi
          sum_b=$(sha256sum bazel-bin/canary.bin | awk '{print $1}')

          if [ -z "$sum_a" ] || [ -z "$sum_b" ]; then
            echo "e2e/repro_canary: sha256 checksum missing or empty" >&2
            exit 1
          fi

          echo "Run A sha256: $sum_a"
          echo "Run B sha256: $sum_b"

          if [ "$sum_a" = "$sum_b" ]; then
            echo "e2e/repro_canary: canary outputs are equal across distinct output bases ($sum_a)" >&2
            exit 1
          fi
  # Fails when `bazel mod tidy` would rewrite the root module files, so a
  # stale MODULE.bazel.lock fails the run. Repository cache only (shared per
  # OS, no disk-cache shard): this job never writes a cache, like
  # e2e-coverage.
  mod-tidy:
    name: Module lockfile is tidy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Enable Linux sandbox user namespaces
        run: .github/scripts/enable_linux_sandbox.sh
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      - name: bazel mod tidy --lockfile_mode=refresh
        run: bazel mod tidy --lockfile_mode=refresh
      - name: bazel build --nobuild --lockfile_mode=update //...
        run: bazel build --nobuild --lockfile_mode=update //...
      - name: bazel build --nobuild --lockfile_mode=error //...
        run: bazel build --nobuild --lockfile_mode=error //...
      - name: git diff --exit-code MODULE.bazel MODULE.bazel.lock
        run: git diff --exit-code MODULE.bazel MODULE.bazel.lock
  # Fails when a repository that returns `repo_metadata(reproducible = True)`
  # is extracted into every output base instead of shared through the repo
  # contents cache, or holds an absolute or repo-escaping symlink. Each run of
  # //tools/repo_contents_cache fetches into two fresh output bases that share
  # the repository cache and one temporary repo contents cache.
  repo-contents-cache:
    name: Repos share one repo contents cache entry
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Enable Linux sandbox user namespaces
        run: .github/scripts/enable_linux_sandbox.sh
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      - name: Host SDK, web SDK, sky_engine, dev_root, fonts, gen_l10n, a dev_tool_deps spoke, sysroot, Chrome and Linux runtime
        run: >
          bazel run //tools/repo_contents_cache --
          @@+flutter+flutter_linux-x64
          @flutter_web_sdk
          @flutter_sky_engine
          @flutter_dev_root
          @flutter_material_fonts
          @@+flutter+flutter_font_subset_linux-x64
          @flutter_gen_l10n
          @@+flutter+dev_tool_deps__args
          @@+flutter+flutter_linux_sysroot_x64
          @flutter_chrome_headless_shell
          @flutter_linux_headless_runtime
      - name: A Flutter SDK spoke
        run: >
          bazel run //tools/repo_contents_cache --
          --workspace=e2e/web_example
          @@ai_rules_flutter++flutter+deps__flutter
      - name: Negative case, local_path repos stay real directories
        run: >
          bazel run //tools/repo_contents_cache --
          --workspace=e2e/smoke
          --expect=real
          @local_sky_engine
          @local_linux-x64
          @local_dev_root
  # Early warning, permanently non-blocking: runs the root tests on Bazel's
  # last release candidate so a break in the next Bazel release shows up before
  # it ships. An upstream release-candidate regression must never block a merge
  # or a tag-push release, so the job is deliberately absent from
  # `conclusion.needs` and carries `continue-on-error`. The lockfile is off
  # because no committed lock can match an unreleased Bazel.
  last_rc:
    name: Bazel last_rc (early warning)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      USE_BAZEL_VERSION: last_rc
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: false
      - name: bazel test --lockfile_mode=off //... --test_output=errors
        run: bazel test --lockfile_mode=off //... --test_output=errors
  # Burn-in for the incompatible flags Bazel has yet to flip: runs the root
  # tests under `--config=strict` (tools/strict.bazelrc). Non-blocking, so the
  # job carries `continue-on-error` and is absent from `conclusion.needs`. It
  # becomes blocking when the burn-in ends on 2026-11-14; it is added to
  # `conclusion.needs` then.
  strict:
    name: Bazel strict flags (burn-in)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached }}
      - name: bazel test --config=strict //... --test_output=errors
        run: bazel test --config=strict //... --test_output=errors
  conclusion:
    name: Conclusion
    needs: [e2e-macos-apple, e2e-macos-toolchain, unit-tests, e2e-linux-app, e2e-linux-small, e2e-linux-examples, e2e-linux-pub-scc, e2e-linux-integration, e2e-windows, e2e-coverage, dart-tool-tests, pre-commit, web-smoke, reproducibility, mod-tidy, repo-contents-cache]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
