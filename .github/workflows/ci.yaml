# CI workflow for rules_flutter (push and pull-request CI; 7-minute budget)
#
# Runs repo-root tests (Starlark unit tests, buildifier lint) and e2e tests
# on every push/PR.
#
# WHAT RUNS WHERE: branch and pull-request pushes run every job below with
# warm caches (one repository cache per OS from setup-bazel plus one Bazel
# disk cache per OS per shard, restored on pushes and re-saved only by pushes
# to main: a branch restores main's keys, and a branch save (the gate's ci/
# candidates) would only duplicate them and evict main's under the 10 GB
# repository cache limit). The nightly
# schedule run executes the same jobs uncached (no disk-cache restore and no
# save of any kind; the content-addressed repository cache still restores).
# A release pushes no tag run. The release gate (release.yaml) reuses this
# workflow's passing nightly run on the tagged commit when there is one.
# Otherwise it dispatches this workflow on the tag with `uncached: true`, which
# runs every job below uncached — no disk-cache restore, no setup-bazel cache
# save, no actions/cache save — so every test executes on the tagged commit
# instead of replaying cached results.
#
# No job checks out rules_dart: every workspace below takes it as a registry
# `bazel_dep`. Local sibling overrides live in gitignored `.bazelrc.user` files,
# which never exist on a runner. The one committed sibling override, in
# e2e/_overlay_tests/native_assets_synthetic, is in no shard below — adding
# it means adding a checkout step too.
#
# SHARDING: push CI keeps at most 2 macOS jobs (the Free plan has 5 macOS
# slots shared with rules_dart), so macOS runs only two fast smoke jobs and
# Linux carries every workspace whose targets can build there (Apple-only
# targets skip themselves through Bazel's own `target_compatible_with`; no
# new tag filters). The complete macOS coverage runs in full.yaml instead
# (nightly, on release tags, or on demand), which releases wait for.
#   e2e-macos-apple:     hello_world's Apple bundles (macOS + iOS simulator),
#     min_versions' iOS/macOS legs against the Apple version floor, plus
#     pub_scc's iOS simulator bundle and plugin registrant check
#   e2e-macos-toolchain: smoke workspace (toolchain resolution, all platforms)
#   unit-tests:          root unit tests, plus the digest-mismatch red fetch
#     (e2e/digest_mismatch, expected to fail on Bazel's checksum error), the
#     xtool red fetch (e2e/xtool_sdk_invalid, expected to fail on the
#     nonexistent bundle path) and the pubspec-shape red fetches
#     (e2e/pub_flutter_shape_red, expected to fail on the malformed
#     `flutter.assets`/`flutter.fonts` sections and the unreadable
#     `environment.sdk` constraints)
#   e2e-linux-app:       hello_world, codegen
#   e2e-linux-small:     smoke, dual_hub, ffi_example, ffi_plugin_example,
#     web_example
#   e2e-linux-examples:  linux_example, cross_compile_example
#   e2e-linux-pub-scc:   pub_scc (2-cycle Android APK + 3-cycle Dart test)
#   e2e-linux-integration: integration_web, integration_linux,
#     integration_android (with KVM for the emulator), min_versions (Dart app,
#     kernel and dart_test targets plus the Android leg against every declared
#     dependency floor; the Apple legs skip themselves via
#     target_compatible_with), android_no_go_sdk (Android leg with no go_sdk
#     block, proving rules_flutter's pinned Go SDK is the default)
#   e2e-coverage:        //tools/check_e2e_coverage (every e2e module in a
#     workflow or with a recorded reason)
#   web-smoke:           web_example through the installed binary
#   repo-contents-cache: //tools/repo_contents_cache (repos marked
#     reproducible are shared through the repo contents cache)
#   e2e-windows:         hello_world (Windows)
# android_example runs in full.yaml (nightly) only: its APK + Kotlin actions
# would make a push job the longest one.
# plugin_example runs in full.yaml only: every target it can build under
# `bazel test //...` is Apple- or Windows-only (its Linux-buildable targets
# are `manual`-tagged, which `//...` excludes everywhere), so a Linux push
# run would execute zero tests there. integration_web/integration_linux used
# to run twice (matrix plus standalone job); now each runs once.
#
# CACHES: one repository cache per OS from setup-bazel (shared by every Bazel
# job; downloads are content-addressed), plus one Bazel disk cache per OS per
# shard managed below with actions/cache. setup-bazel's own disk cache never
# re-saves an unchanged key, so a run that rebuilds actions would lose them;
# instead each shard restores its key (falling back to the newest older key)
# and, on pushes only, deletes the key it restored and saves it back with the
# fresh content. Pull requests and dispatches only restore. Each shard is the
# only writer of its key; the repository key stays shared per OS with
# setup-bazel's first-finisher-wins save. Scheduled (nightly) and
# `uncached` dispatches restore nothing and save nothing. Tag runs (release dispatches,
# `github.ref_type == 'tag'`) restore no disk cache and save nothing either (no disk-cache restore, no
# setup-bazel cache save, no actions/cache save), so every test executes cold
# on the tagged commit; the content-addressed repository cache (and the
# bazelisk cache) still restore, since every fetch through them is
# sha256-pinned and they never replay test results. Saves are
# success-gated (no `always()`): a failed run must not persist its
# half-populated cache over the last good one.
permissions:
  actions: write
  contents: read
name: CI
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  # Nightly uncached run: every job rebuilds and re-executes everything with
  # no disk-cache restore and no save, so a green push run cannot be warm
  # cache replay alone. The repository cache (content-addressed downloads
  # only; it never replays test results) still restores.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      uncached:
        description: Run every job without restoring or saving any Bazel cache
        required: false
        default: false
        type: boolean
concurrency:
  # Runs on main never share a group: each gets its own run-id suffix, so a
  # push cannot cancel the nightly uncached run (or the reverse) and manual
  # dispatches never queue behind each other. Branch pushes and PR runs still
  # share one group per branch or PR and cancel the superseded run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}${{ github.ref == 'refs/heads/main' && format('::{0}', github.run_id) || '' }}
  # Tag runs (release dispatches) gate releases: never cancel them, so a newer trigger cannot
  # leave the release gate waiting on a cancelled run. Branch and PR pushes
  # still cancel superseded runs.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  BAZEL_REPOSITORY_CACHE_KEY_FILES: |
    - MODULE.bazel
    - MODULE.bazel.lock
    - e2e/*/MODULE.bazel
    - flutter/private/versions.bzl
jobs:
  # The macOS-specific signal Linux cannot give: building the macOS desktop
  # bundle and the iOS simulator bundle exercises the Xcode toolchain, the
  # Apple SDKs and the Apple bundle rules (packaging, simulator runtime).
  e2e-macos-apple:
    name: macOS Apple bundles (hello_world macOS + iOS)
    # macOS is deferred to the nightly (owner decision 2026-11-04): pushes and
    # PRs skip this job, and the nightly schedule and dispatched (release)
    # runs keep it. The gate accepts it as skipped by its exact name
    # (control ctl/config.py DEFERRED_JOBS); a red nightly becomes a queue item.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DISK_CACHE_DIR: ~/.cache/bazel-disk
      DISK_CACHE_SHARD: macos-a
    steps:
      - uses: actions/checkout@v7
      - name: Set disk cache key
        run: echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'e2e/*/MODULE.bazel', 'flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached }}
      - name: Restore disk cache
        if: github.event_name != 'schedule' && github.ref_type != 'tag' && !inputs.uncached
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      - name: Point Bazel at the disk cache
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          case "$dir" in "~"*) dir="$HOME${dir#\~}";; esac
          mkdir -p "$dir"
          echo "build --disk_cache=$dir" >> ~/.bazelrc
      - name: bazel test Apple bundles (e2e/hello_world)
        working-directory: e2e/hello_world
        run: bazel test //:macos_bundle_build_test //:ios_bundle_build_test --test_output=errors
      # A real ObjC compile against a Swift module's generated header. It
      # cannot run on Linux, where the ObjC half does not compile.
      - name: bazel test mixed ObjC + Swift plugin (e2e/plugin_example)
        working-directory: e2e/plugin_example
        run: bazel test //mixed_plugin:mixed_plugin_build_test --test_output=errors
      # The same Apple legs against the minimum supported dependency floors:
      # the Linux job below already proves min_versions' Dart app, kernel,
      # dart_test and Android leg, so only the macOS-gated tests run here.
      - name: bazel test Apple bundles (e2e/min_versions)
        working-directory: e2e/min_versions
        run: bazel test //:ios_build_test //:macos_build_test --test_output=errors
      - name: bazel test pub_scc (e2e/pub_scc)
        working-directory: e2e/pub_scc
        run: bazel test //... --test_output=errors
      # `bazel run <flutter_test> -- --update-goldens` on a scratch copy of
      # e2e/codegen: a stale PNG fails the test, the update rewrites it, and
      # the test then passes.
      - name: Check --update-goldens rewrites a stale golden (e2e/codegen)
        working-directory: e2e/codegen
        run: bazel run //:update_goldens_check -- --bazel=bazel
      - name: Report cache sizes
        if: always()
        run: du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo 2>/dev/null || true
      - name: Delete stale disk cache key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key == env.DISK_CACHE_KEY and .ref == env.REF) | .id' || true)
          for id in $ids; do gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null || true; done
      - name: Save disk cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  # The cheapest job in CI (a dozen actions): verifies that every Flutter
  # toolchain alias resolves, guarding the shared rule code all workspaces
  # load, on the OS whose toolchain is the most fragile.
  e2e-macos-toolchain:
    name: macOS toolchain resolution (smoke)
    # macOS is deferred to the nightly (owner decision 2026-11-04): pushes and
    # PRs skip this job, and the nightly schedule and dispatched (release)
    # runs keep it. The gate accepts it as skipped by its exact name
    # (control ctl/config.py DEFERRED_JOBS); a red nightly becomes a queue item.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DISK_CACHE_DIR: ~/.cache/bazel-disk
      DISK_CACHE_SHARD: macos-b
    steps:
      - uses: actions/checkout@v7
      - name: Set disk cache key
        run: echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'e2e/*/MODULE.bazel', 'flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached }}
      - name: Restore disk cache
        if: github.event_name != 'schedule' && github.ref_type != 'tag' && !inputs.uncached
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      - name: Point Bazel at the disk cache
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          case "$dir" in "~"*) dir="$HOME${dir#\~}";; esac
          mkdir -p "$dir"
          echo "build --disk_cache=$dir" >> ~/.bazelrc
      # The e2e/smoke spec runs `bazel test //...` and the cross-module
      # undeclared-import compile negative (`//:consumer_negative` must fail on
      # the guard refusal); //tools/e2e_runner enforces both.
      - name: Run e2e/smoke
        run: bazel run //tools/e2e_runner -- --workspace=e2e/smoke --bazel=bazel
      - name: Report cache sizes
        if: always()
        run: du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo 2>/dev/null || true
      - name: Delete stale disk cache key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api "repos/$REPO/actions/caches?per_page=100" --jq '.actions_caches[] | select(.key == env.DISK_CACHE_KEY and .ref == env.REF) | .id' || true)
          for id in $ids; do gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null || true; done
      - name: Save disk cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DISK_CACHE_DIR: ~/.cache/bazel-disk
      DISK_CACHE_SHARD: linux-unit
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/free-disk
      - name: Enable Linux sandbox user namespaces
        run: .github/scripts/enable_linux_sandbox.sh
      - name: Set disk cache key
        run: echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'e2e/*/MODULE.bazel', 'flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.uncached }}
      - name: Restore disk cache
        if: github.event_name != 'schedule' && github.ref_type != 'tag' && !inputs.uncached
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      - name: Point Bazel at the disk cache
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          case "$dir" in "~"*) dir="$HOME${dir#\~}";; esac
          mkdir -p "$dir"
          echo "build --disk_cache=$dir" >> ~/.bazelrc
      # Default strategy selection must pick linux-sandbox: Bazel falls back to
      # processwrapper-sandbox when the runner blocks user namespaces. Uncached
      # on a scratch output base so at least one spawn really runs.
      - name: Prove sandboxed actions run under linux-sandbox
        run: |
          base="${RUNNER_TEMP}/sandbox_proof_base"
          bep="${RUNNER_TEMP}/sandbox_proof_bep.json"
          trap 'bazel "--output_base=${base}" shutdown' EXIT
          bazel "--output_base=${base}" test //flutter/tests/ci_linux_sandbox_guard:ci_linux_sandbox_guard_unit_test --disk_cache= --nocache_test_results "--build_event_json_file=${bep}"
          python3 - "$bep" <<'PY'
          import json, sys
          counts = {}
          for line in open(sys.argv[1]):
              summary = json.loads(line).get("buildMetrics", {}).get("actionSummary", {})
              for runner in summary.get("runnerCount", []):
                  counts[runner["name"]] = counts.get(runner["name"], 0) + int(runner.get("count", 0))
          print("runnerCount:", counts)
          if counts.get("processwrapper-sandbox", 0) != 0:
              sys.exit("processwrapper-sandbox spawns: %d" % counts["processwrapper-sandbox"])
          if counts.get("linux-sandbox", 0) < 1:
              sys.exit("no linux-sandbox spawns")
          PY
      - name: bazel test //... (root unit tests)
        run: bazel test //... --test_output=errors
      - name: bazel test //... 5x flake sweep (root unit tests, pull requests)
        if: github.event_name == 'pull_request'
        timeout-minutes: 75
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/flake_sweep.log"
          bazel test //... --flaky_test_attempts=1 --runs_per_test=5 --runs_per_test_detects_flakes --nocache_test_results --test_tag_filters=-manual --test_output=errors 2>&1 | tee "$log"
          if grep -E '(^|[[:space:]])FLAKY([,[:space:]]|$)' "$log"; then
            echo "::error::a test was FLAKY across 5 runs"
            exit 1
          fi
      # The updater drops rules_dart's analyzer/format aspects, so the golden
      # is the same whether this check or the Dart corpus tests run first.
      - name: Corpus action graph matches the checked-in golden
        run: |
          bazel aquery --skip_incompatible_explicit_targets --output=jsonproto "set($(grep -vE '^\s*(#|$)' flutter/tests/corpus/golden_targets.txt))" > /tmp/flutter_corpus_aquery.json
          bazel run //flutter/tests/corpus:actions_golden -- --check /tmp/flutter_corpus_aquery.json
      - name: bazel test //flutter/tests/corpus:...
        run: bazel test //flutter/tests/corpus:... --test_output=errors
      # Lint-baseline red path: //flutter/tests/lint_baseline_fixture:red is a
      # manual flutter_library with one unbaselined avoid_print diagnostic.
      # Testing a library with no test targets exits 4 when dart_analyze
      # succeeds, so both 0 and 4 count as an unexpected pass; both summary
      # and source modes must fail with the baseline verdict.
      - name: Unbaselined lint diagnostic fails analysis
        run: |
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          for mode in summary source; do
            rc=0
            if [ "$mode" = summary ]; then
              bazel test //flutter/tests/lint_baseline_fixture:red >"$log" 2>&1 || rc=$?
            else
              bazel test --@rules_dart//dart:analyzer_summaries=false //flutter/tests/lint_baseline_fixture:red >"$log" 2>&1 || rc=$?
            fi
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 4 ]; then
              cat "$log"
              echo "expected unbaselined lint to fail analysis in $mode mode, got exit $rc"
              exit 1
            fi
            for expected in \
              "flutter/tests/lint_baseline_fixture/lib/red.dart" \
              "avoid_print" \
              "observed 1, ceiling 0"; do
              if ! grep -F -q "$expected" "$log"; then
                cat "$log"
                echo "expected $mode output to mention [$expected]"
                exit 1
              fi
            done
          done
      # Digest red paths: e2e/digest_mismatch pins each failing fetch to its
      # checksum or shape diagnostic, then proves the correct digests build.
      - name: Run e2e/digest_mismatch
        run: bazel run //tools/e2e_runner -- --workspace=e2e/digest_mismatch --bazel=bazel
      # Xtool red path: the invalid darwin.artifactbundle path must fail on the
      # path diagnostic before any LLVM download starts.
      - name: Run e2e/xtool_sdk_invalid
        run: bazel run //tools/e2e_runner -- --workspace=e2e/xtool_sdk_invalid --bazel=bazel
      # Pubspec-shape red paths: each malformed pubspec fails on its own refusal.
      - name: Run e2e/pub_flutter_shape_red
        run: bazel run //tools/e2e_runner -- --workspace=e2e/pub_flutter_shape_red --bazel=bazel
      # Podfile.lock evaluation red path: the tab-indented fixture fails at hub
      # evaluation on the reader's tab refusal.
      - name: Run e2e/podfile_lock_red
        run: bazel run //tools/e2e_runner -- --workspace=e2e/podfile_lock_red --bazel=bazel
      # CocoaPods unmapped pod red path: deps_pods_unmapped carries no mapping
      # and no ignore entry for BigInt, so querying the spoke fails at fetch
      # time. Only this portable command runs here; the macOS simulator
      # commands of the spec run in full.yaml.
      - name: Run e2e/integration_ios (CocoaPods unmapped pod red path)
        run: bazel run //tools/e2e_runner -- --workspace=e2e/integration_ios --command="CocoaPods unmapped pod red path" --bazel=bazel
      # Compile-soundness red path: the entrypoint imports a sibling that
      # exists on disk but is never declared, so executing the compile must
      # fail on the guard's refusal — never with a built dill. The target is
      # manual so `//...` stays green; the grep pins the guard message so a
      # frontend_server crash or a refactor that stops checking directives
      # cannot pass as red.
      - name: Undeclared-import compile fails on the guard refusal
        run: |
          if out=$(bazel build //flutter/tests:_compile_api_build_negative 2>&1); then
            echo "$out"
            echo "expected the undeclared-import compile to fail, but it succeeded"
            exit 1
          fi
          echo "$out" | grep -F "is not a declared input"
      # The other two compile-api negatives are `manual` too, so `bazel test
      # //flutter/tests/...` never builds them; this step builds each one
      # explicitly. The incremental negative imports an undeclared sibling,
      # which the directive guard refuses before the compiler runs, so it
      # keeps the default spawn strategy. The `package:` negative passes the
      # guard (the URI does not escape); under the default sandbox the
      # compiler fails earlier with `File not found`, so that build runs with
      # `--spawn_strategy=local`: the compiler reads the file off the exec
      # root and the post-compile read-set check refuses it. A build that
      # succeeds fails the job, and so does a failure that does not name the
      # refusal, so a compiler crash cannot pass as red.
      - name: Undeclared-input compile negatives fail on the refusal
        run: |
          if out=$(bazel build //flutter/tests:_compile_api_build_negative_incremental 2>&1); then
            echo "$out"
            echo "expected the incremental undeclared-import compile to fail, but it succeeded"
            exit 1
          fi
          echo "$out" | grep -F "is not a declared input"
          if out=$(bazel build --spawn_strategy=local //flutter/tests:_compile_api_build_negative_pkg 2>&1); then
            echo "$out"
            echo "expected the undeclared package: read to fail, but it succeeded"
            exit 1
          fi
          echo "$out" | grep -F "is not a declared input"
      # Coverage check: every manual `_compile_api_build_negative_*` target in
      # compile_api_test.bzl must be named by a must-fail step that greps the
      # refusal. Deleting the step above, or dropping its grep, turns this red
      # even while `//...` stays green.
      - name: Check every compile-api negative is covered
        run: bazel run //tools/check_compile_api_coverage
      # Coverage check: every hostile fixture declared in web_test.bzl must be
      # named by the must-fail step below, and that step must pin the guard
      # message. Adding a spelling without a build, or dropping one from the
      # step, turns this red even while `//...` stays green.
      - name: Check every web-guard hostile fixture is covered
        run: bazel run //tools/check_web_guard_coverage
      # Web-guard hostile fixtures: each imports a file that exists on the
      # host but is in no target's `srcs`, in a different URI spelling. They
      # stay `manual`, so `//...` stays green; this step builds each one
      # explicitly and requires the guard's refusal. A build that succeeds
      # fails the job, and so does a failure that does not name the guard
      # message, so a compiler crash cannot pass as red. Both compilers are
      # covered: the default dart2wasm target and its dart2js twin.
      - name: Web-guard hostile imports fail on the guard refusal
        run: |
          for target in \
            //flutter/tests:_web_guard_hostile_file \
