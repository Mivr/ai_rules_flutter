# CI workflow for rules_flutter (push and pull-request CI; 7-minute budget)
#
# Runs repo-root tests (Starlark unit tests, buildifier lint) and e2e tests
# on every push/PR.
#
# No job checks out rules_dart: every workspace below takes it as a registry
# `bazel_dep`. Local sibling overrides live in gitignored `.bazelrc.user` files,
# which never exist on a runner. The one committed sibling override, in
# e2e/_overlay_tests/native_assets_synthetic, is in no shard below — adding
# it means adding a checkout step too.
#
# SHARDING: push CI keeps at most 2 macOS jobs (the Free plan has 5 macOS
# slots shared with rules_dart), so macOS runs only two fast smoke jobs and
# Linux carries every workspace whose targets can build there (Apple-only
# targets skip themselves through Bazel's own `target_compatible_with`; no
# new tag filters). The complete macOS coverage runs in full.yaml instead
# (weekly, on release tags, or on demand), which releases wait for.
#   e2e-macos-apple:     hello_world's Apple bundles (macOS + iOS simulator)
#   e2e-macos-toolchain: smoke workspace (toolchain resolution, all platforms)
#   unit-tests:          root unit tests
#   e2e-linux-app:       hello_world, codegen
#   e2e-linux-small:     smoke, dual_hub, ffi_example, ffi_plugin_example,
#     web_example
#   e2e-linux-integration: integration_web, integration_linux,
#     integration_android (with KVM for the emulator)
#   web-smoke:           web_example through the installed binary
#   e2e-windows:         hello_world (Windows)
# plugin_example runs in full.yaml only: every target it can build under
# `bazel test //...` is Apple- or Windows-only (its Linux-buildable targets
# are `manual`-tagged, which `//...` excludes everywhere), so a Linux push
# run would execute zero tests there. integration_web/integration_linux used
# to run twice (matrix plus standalone job); now each runs once.
#
# CACHES: one repository cache per OS from setup-bazel (shared by every Bazel
# job; downloads are content-addressed), plus one Bazel disk cache per OS per
# shard managed below with actions/cache. setup-bazel's own disk cache never
# re-saves an unchanged key, so a run that rebuilds actions would lose them;
# instead each shard restores its key (falling back to the newest older key)
# and, on pushes only, deletes the key it restored and saves it back with the
# fresh content. Pull requests and dispatches only restore. Each shard is the
# only writer of its key; the repository key stays shared per OS with
# setup-bazel's first-finisher-wins save.
permissions:
  actions: write
  contents: read
name: CI
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  BAZEL_REPOSITORY_CACHE_KEY_FILES: |
    - MODULE.bazel
    - MODULE.bazel.lock
    - e2e/*/MODULE.bazel
    - flutter/private/versions.bzl
jobs:
  # The macOS-specific signal Linux cannot give: building the macOS desktop
  # bundle and the iOS simulator bundle exercises the Xcode toolchain, the
  # Apple SDKs and the Apple bundle rules (packaging, simulator runtime).
  e2e-macos-apple:
    name: macOS Apple bundles (hello_world macOS + iOS)
    runs-on: macos-latest
    env:
      DISK_CACHE_DIR: ~/.cache/bazel-disk
      DISK_CACHE_SHARD: macos-a
    steps:
      - uses: actions/checkout@v7
      - name: Set disk cache key
        run: echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'e2e/*/MODULE.bazel', 'flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' }}
      - name: Restore disk cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      - name: Point Bazel at the disk cache
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          case "$dir" in "~"*) dir="$HOME${dir#\~}";; esac
          mkdir -p "$dir"
          echo "build --disk_cache=$dir" >> ~/.bazelrc
      - name: bazel test Apple bundles (e2e/hello_world)
        working-directory: e2e/hello_world
        run: bazel test //:macos_bundle_build_test //:ios_bundle_build_test --test_output=errors
      - name: Report cache sizes
        if: always()
        run: du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo 2>/dev/null || true
      - name: Delete stale disk cache key
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --jq ".actions_caches[] | select(.key == \"$DISK_CACHE_KEY\" and .ref == \"${{ github.ref }}\") | .id" || true)
          for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null || true; done
      - name: Save disk cache
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  # The cheapest job in CI (a dozen actions): verifies that every Flutter
  # toolchain alias resolves, guarding the shared rule code all workspaces
  # load, on the OS whose toolchain is the most fragile.
  e2e-macos-toolchain:
    name: macOS toolchain resolution (smoke)
    runs-on: macos-latest
    env:
      DISK_CACHE_DIR: ~/.cache/bazel-disk
      DISK_CACHE_SHARD: macos-b
    steps:
      - uses: actions/checkout@v7
      - name: Set disk cache key
        run: echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'e2e/*/MODULE.bazel', 'flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' }}
      - name: Restore disk cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      - name: Point Bazel at the disk cache
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          case "$dir" in "~"*) dir="$HOME${dir#\~}";; esac
          mkdir -p "$dir"
          echo "build --disk_cache=$dir" >> ~/.bazelrc
      - name: bazel test //... (e2e/smoke)
        working-directory: e2e/smoke
        run: bazel test //... --test_output=errors
      - name: Report cache sizes
        if: always()
        run: du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo 2>/dev/null || true
      - name: Delete stale disk cache key
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --jq ".actions_caches[] | select(.key == \"$DISK_CACHE_KEY\" and .ref == \"${{ github.ref }}\") | .id" || true)
          for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null || true; done
      - name: Save disk cache
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      DISK_CACHE_DIR: ~/.cache/bazel-disk
      DISK_CACHE_SHARD: linux-unit
    steps:
      - uses: actions/checkout@v7
      - name: Set disk cache key
        run: echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'e2e/*/MODULE.bazel', 'flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' }}
      - name: Restore disk cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      - name: Point Bazel at the disk cache
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          case "$dir" in "~"*) dir="$HOME${dir#\~}";; esac
          mkdir -p "$dir"
          echo "build --disk_cache=$dir" >> ~/.bazelrc
      - name: bazel test //... (root unit tests)
        run: bazel test //... --test_output=errors
      - name: Report cache sizes
        if: always()
        run: du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo 2>/dev/null || true
      - name: Delete stale disk cache key
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --jq ".actions_caches[] | select(.key == \"$DISK_CACHE_KEY\" and .ref == \"${{ github.ref }}\") | .id" || true)
          for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null || true; done
      - name: Save disk cache
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  e2e-linux-app:
    name: E2E Linux app (hello_world, codegen)
    runs-on: ubuntu-latest
    env:
      WORKSPACES: hello_world codegen
      DISK_CACHE_DIR: ~/.cache/bazel-disk
      DISK_CACHE_SHARD: linux-app
    steps:
      - uses: actions/checkout@v7
      - name: Set disk cache key
        run: echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'e2e/*/MODULE.bazel', 'flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' }}
      - name: Restore disk cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      - name: Point Bazel at the disk cache
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          case "$dir" in "~"*) dir="$HOME${dir#\~}";; esac
          mkdir -p "$dir"
          echo "build --disk_cache=$dir" >> ~/.bazelrc
      # --test_output=errors so a failure's assertion reaches this log. Without
      # it the output stays in a test.log on the runner and is discarded with
      # the machine. Every workspace runs; a failure is recorded and the loop
      # continues, then the step fails.
      - name: bazel test //... (shard workspaces)
        run: |
          failed=""
          for ws in $WORKSPACES; do
            echo "::group::e2e/$ws"
            if (cd "e2e/$ws" && bazel test //... --test_output=errors); then
              echo "PASS e2e/$ws"
            else
              echo "FAIL e2e/$ws"
              failed="$failed $ws"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failing workspaces:$failed"
            exit 1
          fi
      - name: Report cache sizes
        if: always()
        run: du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo 2>/dev/null || true
      - name: Delete stale disk cache key
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --jq ".actions_caches[] | select(.key == \"$DISK_CACHE_KEY\" and .ref == \"${{ github.ref }}\") | .id" || true)
          for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null || true; done
      - name: Save disk cache
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  e2e-linux-small:
    name: E2E Linux small (smoke, dual_hub, ffi_example, ffi_plugin_example, web_example)
    runs-on: ubuntu-latest
    env:
      WORKSPACES: smoke dual_hub ffi_example ffi_plugin_example web_example
      DISK_CACHE_DIR: ~/.cache/bazel-disk
      DISK_CACHE_SHARD: linux-small
    steps:
      - uses: actions/checkout@v7
      - name: Set disk cache key
        run: echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'e2e/*/MODULE.bazel', 'flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' }}
      - name: Restore disk cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      - name: Point Bazel at the disk cache
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          case "$dir" in "~"*) dir="$HOME${dir#\~}";; esac
          mkdir -p "$dir"
          echo "build --disk_cache=$dir" >> ~/.bazelrc
      - name: bazel test //... (shard workspaces)
        run: |
          failed=""
          for ws in $WORKSPACES; do
            echo "::group::e2e/$ws"
            if (cd "e2e/$ws" && bazel test //... --test_output=errors); then
              echo "PASS e2e/$ws"
            else
              echo "FAIL e2e/$ws"
              failed="$failed $ws"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failing workspaces:$failed"
            exit 1
          fi
      - name: Report cache sizes
        if: always()
        run: du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo 2>/dev/null || true
      - name: Delete stale disk cache key
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --jq ".actions_caches[] | select(.key == \"$DISK_CACHE_KEY\" and .ref == \"${{ github.ref }}\") | .id" || true)
          for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null || true; done
      - name: Save disk cache
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  e2e-linux-integration:
    name: E2E Linux integration (web, linux, android)
    runs-on: ubuntu-latest
    env:
      WORKSPACES: integration_web integration_linux integration_android
      DISK_CACHE_DIR: ~/.cache/bazel-disk
      DISK_CACHE_SHARD: linux-integration
    steps:
      - uses: actions/checkout@v7
      - name: Set disk cache key
        run: echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'e2e/*/MODULE.bazel', 'flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' }}
      - name: Restore disk cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      - name: Point Bazel at the disk cache
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          case "$dir" in "~"*) dir="$HOME${dir#\~}";; esac
          mkdir -p "$dir"
          echo "build --disk_cache=$dir" >> ~/.bazelrc
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: bazel test //... (shard workspaces)
        run: |
          failed=""
          for ws in $WORKSPACES; do
            echo "::group::e2e/$ws"
            if (cd "e2e/$ws" && bazel test //... --test_output=errors); then
              echo "PASS e2e/$ws"
            else
              echo "FAIL e2e/$ws"
              failed="$failed $ws"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failing workspaces:$failed"
            exit 1
          fi
      - name: Report cache sizes
        if: always()
        run: du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo 2>/dev/null || true
      - name: Delete stale disk cache key
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --jq ".actions_caches[] | select(.key == \"$DISK_CACHE_KEY\" and .ref == \"${{ github.ref }}\") | .id" || true)
          for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null || true; done
      - name: Save disk cache
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  e2e-windows:
    name: E2E (hello_world, windows-latest)
    runs-on: windows-latest
    env:
      DISK_CACHE_DIR: D:/_bazel-disk
      DISK_CACHE_SHARD: windows-hello
    steps:
      - uses: actions/checkout@v7
      - name: Set disk cache key
        shell: bash
        run: echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'e2e/*/MODULE.bazel', 'flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
      # See the note above for the shared repository cache. The output base
      # setup-bazel sets (D:/_bazel) takes precedence over the Windows step's
      # --output_user_root and is as short.
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' }}
      - name: Restore disk cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      # PowerShell, so ~/.bazelrc is the same file setup-bazel wrote (unlike
      # Git Bash, whose home can differ).
      - name: Point Bazel at the disk cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ env.DISK_CACHE_DIR }}" | Out-Null
          Add-Content ~/.bazelrc "build --disk_cache=${{ env.DISK_CACHE_DIR }}"
      # GitHub's windows-latest image exports ANDROID_NDK_HOME with backslashes
      # (C:\Android\...), but rules_android_ndk's _create_symlinks() strips the
      # NDK prefix with a forward-slash string match against ctx.path() output,
      # so a backslashed value makes the symlink target escape the repo dir and
      # the fetch fails. Hand it a forward-slash path, as upstream's own Windows
      # CI does. See https://github.com/bazelbuild/rules_android_ndk/pull/108
      - name: Normalize ANDROID_NDK_HOME to forward slashes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ndk = $env:ANDROID_NDK_HOME ?? $env:ANDROID_NDK_ROOT
          "ANDROID_NDK_HOME=$($ndk -replace '\\','/')" >> $env:GITHUB_ENV
      # --test_output=errors so a failure's assertion reaches this log. Without
      # it the output stays in a test.log on the runner and is discarded with
      # the machine.
      - name: bazel test //... (e2e/hello_world)
        if: runner.os != 'Windows'
        working-directory: e2e/hello_world
        run: bazel test //... --test_output=errors
      # On Windows, Bazel's default output root lives under a long per-user
      # temp path; nested runfiles (e.g. the hermetic Python interpreter's
      # _socket.pyd used by rules_android's aar_embedded_jars_extractor) then
      # exceed the 260-char MAX_PATH limit and fail to load with
      # "DLL load failed ... The filename or extension is too long".
      # A short --output_user_root keeps every generated path well under MAX_PATH.
      # (`BAZEL_OUTPUT_BASE` is not read by Bazel; the startup flag is required.)
      # --*_tag_filters=-no-windows-ci skips targets that build fine on
      # macOS/Linux but exceed the windows-latest runner's commit limit
      # (RAM + its small fixed pagefile). Today that's hello_world's Android
      # target: rules_android's resource compiler launches its JVM with
      # -Xms3G, eagerly committing 3 GiB and OOMing. Android is still covered
      # on the macOS and Linux runners. The build filter (not just the test
      # filter) is required because `bazel test //...` builds every matched
      # target, including the non-test app, so a test-only filter wouldn't
      # stop the OOMing build action.
      - name: bazel test //... (e2e/hello_world)
        if: runner.os == 'Windows'
        working-directory: e2e/hello_world
        run: bazel --output_user_root=C:/b test //... --test_output=errors --build_tag_filters=-no-windows-ci --test_tag_filters=-no-windows-ci
      - name: Report cache sizes
        if: always()
        shell: bash
        run: du -sh D:/_bazel-disk D:/_bazel-repo C:/_bazel-disk C:/_bazel-repo 2>/dev/null || true
      - name: Delete stale disk cache key
        if: always() && github.event_name == 'push'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --jq ".actions_caches[] | select(.key == \"$DISK_CACHE_KEY\" and .ref == \"${{ github.ref }}\") | .id" || true)
          for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null || true; done
      - name: Save disk cache
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  # The hooks in .pre-commit-config.yaml, over every file. Nothing else runs
  # them for a commit made without `prek install`.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: j178/prek-action@v3.0.1
        with:
          # Keep in step with prek in multitool.lock.json
          prek-version: 0.5.5
  dart-tool-tests:
    name: Dart tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Run dev_tool tests
        working-directory: tools/dev_tool
        # Exclude e2e tests (tagged @Tags(['e2e'])): they need a browser/CDP,
        # iOS simulators, or a running macOS app — none available on this
        # runner. Real-render coverage lives in the Bazel e2e workspaces and,
        # for web, in the `web-smoke` job below.
        #
        # `runfiles` is excluded for a different reason: those tests read
        # fixtures declared in a Bazel target's `data` and resolve them through
        # the runfiles tree, which exists under `bazel test` and not here. They
        # are covered by their Bazel targets, which this job does not replace.
        run: dart test -x e2e -x runfiles
      # `-x runfiles` for the same reason as the dev_tool step above: these
      # tools are Bazel scripts, and one of them imports a package that arrives
      # through its `dart_test` deps rather than through this pubspec. Excluded
      # here, covered by //flutter/private/tools:flutter_test_runner_test.
      - name: Run private tool tests
        working-directory: flutter/private/tools
        run: dart pub get && dart test -x runfiles
  # The only place CI runs the binary users install rather than `dart run`.
  # One `-c dbg` Chrome run, asserted down to a VM service that answers
  # `getVersion` — `app.started` alone does not prove DWDS came up.
  web-smoke:
    name: Web smoke (DWDS VM service)
    runs-on: ubuntu-latest
    # Cold, this downloads the Flutter SDK, the engine artifacts and the web
    # SDK, then AOT-compiles the dev tool before the run itself starts.
    timeout-minutes: 60
    env:
      DISK_CACHE_DIR: ~/.cache/bazel-disk
      DISK_CACHE_SHARD: linux-web
    steps:
      - uses: actions/checkout@v7
      - name: Set disk cache key
        run: echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'e2e/*/MODULE.bazel', 'flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ github.event_name == 'push' }}
      - name: Restore disk cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ env.DISK_CACHE_SHARD }}-
      - name: Point Bazel at the disk cache
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          case "$dir" in "~"*) dir="$HOME${dir#\~}";; esac
          mkdir -p "$dir"
          echo "build --disk_cache=$dir" >> ~/.bazelrc
      # setup-bazel pins every workspace to one output base with a `startup`
      # line in ~/.bazelrc. This job runs two workspaces: the root, whose
      # bazel-bin holds the dev tool binary under test, and e2e/web_example,
      # which that binary builds. Sharing a base, the second would restart the
      # server and replace the execroot the running binary lives in. Drop the
      # line so each workspace keeps Bazel's own per-workspace default.
      - name: Keep one output base per workspace
        run: sed -i '/^startup --output_base=/d' ~/.bazelrc
      # The test process itself resolves this package's pubspec, and dwds
      # requires a Dart newer than the runner's default. The tool under test
      # runs on the hermetic Flutter toolchain either way.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1, which
      # blocks Chrome's sandbox from creating the user namespace it needs, and
      # Chrome then never announces a DevTools debugging port. Relax the sysctl
      # rather than passing --no-sandbox: this job exists to prove a real Chrome
      # run works, which a weakened browser would not establish.
      - name: Allow Chrome's sandbox to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # google-chrome is preinstalled on this runner and is on PATH, which is
      # exactly how the dev tool resolves it on Linux (host_tools.dart) — no
      # CHROME_EXECUTABLE needed. xvfb gives that Chrome a display.
      #
      # Run through tool/e2e.dart rather than `dart test` directly: `dart test`
      # exits 0 when every selected test skipped, so a skip gate would take this
      # job green having executed nothing. The runner reads the JSON result
      # stream and fails unless a verdict was reached, nothing failed, and at
      # least one test ran. It supplies `--tags=e2e` and `--concurrency=1`
      # itself and resolves tools/dev_tool from its own location.
      - name: Web smoke
        run: xvfb-run -a dart run tools/dev_tool/tool/e2e.dart test/e2e/web_smoke_e2e_test.dart
      - name: Report cache sizes
        if: always()
        run: du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo 2>/dev/null || true
      - name: Delete stale disk cache key
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --jq ".actions_caches[] | select(.key == \"$DISK_CACHE_KEY\" and .ref == \"${{ github.ref }}\") | .id" || true)
          for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null || true; done
      - name: Save disk cache
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  conclusion:
    name: Conclusion
    needs: [e2e-macos-apple, e2e-macos-toolchain, unit-tests, e2e-linux-app, e2e-linux-small, e2e-linux-integration, e2e-windows, dart-tool-tests, pre-commit, web-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        run: echo '${{ toJSON(needs) }}' | jq -e 'with_entries(select(.value.result != "success" and .value.result != "skipped")) | length == 0'
