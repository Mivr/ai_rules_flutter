# Mivr/ai_rules_flutter workflow (moved from the frozen Mivr/rules_flutter fork on 2026-10-28).
# Manual-only Android/Web build-cost bench (free Linux runners, no caches).
#
# Speed-of-light (SOL) mode for the generated monorepo's Android app
# (//app:app_android, the APK) or Web app (//app:app_web, the deployment
# directory). For the chosen platform it measures both configurations:
# release (-c opt) and debug (-c dbg). Each configuration runs the clean
# flow as a measured `bazel --batch build` and then an app edit and a core
# (layer 0) edit against a warm server; every flow replays the minimal
# chain of the same tool binaries Bazel ran and proves the final output
# (the APK/AAB entries, or every file under the web deployment root) was
# reproduced byte for byte. The SOL number is whole-tree user+sys CPU
# seconds; medians over repeats go to android-sol.json or web-sol.json,
# which is written and uploaded even when a configuration fails (its
# remaining flows carry the error as their reason).
#
# The Android leg uses the runner's preinstalled SDK and NDK, forwarded
# into the repository rules with --repo_env as the e2e workspaces do. The
# Web leg needs no runner SDK.
#
# Cost: workflow_dispatch only (never automatic), ubuntu-latest, 5 h job
# timeout, one small artifact (retention 3 days), no caches, build outputs
# never uploaded. Must stay that way: this workflow is the control plane's
# daily Android/Web perf dispatch.
name: Linux perf bench
"on":
  workflow_dispatch:
    inputs:
      head_ref:
        description: rules_flutter ref to measure
        required: true
        type: string
      platform:
        description: "bench platform: android or web"
        type: choice
        options: [android, web]
      target_loc:
        description: total Dart lines to generate
        default: "500000"
        type: string
      seed:
        description: generator seed
        default: "1"
        type: string
      repeats:
        description: repeats per scenario (medians are over these)
        default: "3"
        type: string
      lockfile:
        description: "measured workspace lockfile: none or a committed MODULE.bazel.lock"
        default: committed
        type: choice
        options: [none, committed]
permissions:
  contents: read
jobs:
  bench:
    name: Linux bench
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out bench tooling (this branch)
        uses: actions/checkout@v7
        with:
          path: tools-src
      - name: Check out rules_flutter at head_ref
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.head_ref }}
          path: rules-head
      # Installs Bazel only (no cache configuration: every build is clean).
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      # The runner's preinstalled Android SDK + NDK, forwarded into
      # repository rules with --repo_env (repository rules never see the
      # client environment otherwise). The NDK is derived at runtime: the
      # image ships several versions side by side and only a versioned
      # directory works. The Web bench needs neither.
      - name: Point Bazel at the runner's Android SDK and NDK
        if: inputs.platform == 'android'
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME" || { echo "ANDROID_HOME is not set"; exit 1; }
          ndk="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
          test -d "$ndk" || { echo "no NDK under $ANDROID_HOME/ndk"; exit 1; }
          echo "build --repo_env=ANDROID_HOME=$ANDROID_HOME" >> ~/.bazelrc
          echo "build --repo_env=ANDROID_NDK_HOME=$ndk" >> ~/.bazelrc
      - name: Generate pristine monorepo
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools-src/tools/perf/gen_monorepo.py" generate \
            --target-loc "${{ inputs.target_loc }}" \
            --seed "${{ inputs.seed }}" \
            --rules-flutter "$GITHUB_WORKSPACE/rules-head" \
            --out "$RUNNER_TEMP/ws-head-pristine"
      - name: Generate committed lockfile
        # One unmeasured analysis-only build per configuration writes
        # MODULE.bazel.lock into the pristine workspace before measuring.
        # Without this the generated workspace has no lock (lockfile=none).
        if: inputs.lockfile == 'committed'
        run: |
          set -euo pipefail
          ws="$RUNNER_TEMP/ws-head-pristine"
          out="$RUNNER_TEMP/lock-out"
          target="//app:app_${{ inputs.platform }}"
          rm -rf "$out"
          for flags in "-c opt" "-c dbg"; do
            (cd "$ws" && bazel --output_base="$out" build $flags "$target" --nobuild)
          done
          (cd "$ws" && bazel --output_base="$out" shutdown)
          rm -rf "$out"
          test -f "$ws/MODULE.bazel.lock"
      - name: Measure speed-of-light
        # Both configurations of the selected platform, one repeat at a
        # time: sol.py run resets the workspace from pristine before each
        # config, builds the three scenarios, replays their execution logs
        # and shuts its server down. A failing config is recorded and the
        # loop continues; the step then exits non-zero, but summarize and
        # upload still run.
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/tools-src/tools/perf"
          run_sol() {
            python3 "$tools/sol.py" run --tools "$tools" \
              --pristine "$RUNNER_TEMP/ws-head-pristine" \
              --work "$RUNNER_TEMP/sol-run-$rep" \
              --out-base "$RUNNER_TEMP/sol-out-$rep" \
              --results "$GITHUB_WORKSPACE/sol-results" \
              --rep "$rep" \
              "$@"
          }
          failed=0
          for rep in $(seq 1 "${{ inputs.repeats }}"); do
            rm -rf "$RUNNER_TEMP/sol-out-$rep" "$RUNNER_TEMP/sol-run-$rep"
            case "${{ inputs.platform }}" in
              android) run_sol --config android_release --config android_debug || failed=1 ;;
              web) run_sol --config web_release --config web_debug || failed=1 ;;
              *) echo "unknown platform: ${{ inputs.platform }}"; exit 1 ;;
            esac
          done
          exit "$failed"
      - name: Summarize speed-of-light
        # Runs even when measuring failed, so <platform>-sol.json (with the
        # finished flows and the recorded reasons) is always written.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/tools-src/tools/perf"
          sha="$(git -C "$GITHUB_WORKSPACE/rules-head" rev-parse HEAD)"
          python3 "$tools/sol.py" summarize \
            --results "$GITHUB_WORKSPACE/sol-results" \
            --sha "$sha" \
            --repeats "${{ inputs.repeats }}" \
            --target-loc "${{ inputs.target_loc }}" \
            --seed "${{ inputs.seed }}" \
            --lockfile "${{ inputs.lockfile }}" \
            --out "$GITHUB_WORKSPACE/${{ inputs.platform }}-sol.json"
          {
            echo '```json'
            cat "$GITHUB_WORKSPACE/${{ inputs.platform }}-sol.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload platform sol
        # Runs even when measuring failed: the artifact explains the run.
        # Only the small result file is uploaded, never a build output.
        if: ${{ !cancelled() && inputs.head_ref != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-sol
          path: ${{ inputs.platform }}-sol.json
          retention-days: 3
