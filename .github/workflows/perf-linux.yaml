# Mivr/ai_rules_flutter workflow (moved from the frozen Mivr/rules_flutter fork on 2026-10-28).
# Manual-only Android/Web build-cost bench (free Linux runners, no caches).
#
# Speed-of-light (SOL) mode for the generated monorepo's Android app
# (//app:app_android, the APK) or Web app (//app:app_web, the deployment
# directory). For the chosen platform it measures both configurations:
# release (-c opt) and debug (-c dbg). Each configuration runs the clean
# flow as a measured `bazel --batch build` and then an app edit and a core
# (layer 0) edit against a warm server; every flow replays the minimal
# chain of the same tool binaries Bazel ran and proves the final output
# (the APK/AAB entries, or every file under the web deployment root) was
# reproduced byte for byte. The SOL number is whole-tree user+sys CPU
# seconds; medians over repeats go to android-sol.json or web-sol.json,
# which is written and uploaded even when a configuration fails (its
# remaining flows carry the error as their reason).
#
# The Android leg uses the runner's preinstalled SDK and NDK, forwarded
# into the repository rules with --repo_env as the e2e workspaces do. The
# Web leg needs no runner SDK.
#
# A/B mode (ab=flags): the same-runner paired control/treatment run of
# tools/perf/ab.py. Control is the pristine workspace, treatment adds
# bazel_flags (applied to that copy only); repeats alternate which arm
# runs first. It writes and uploads <platform>-ab.json instead of
# <platform>-sol.json. ab=off is the single run described above, with
# bazel_flags (when set) applied to the measured workspace.
#
# Cost: workflow_dispatch only (never automatic), ubuntu-latest, 5 h job
# timeout, one small artifact (retention 3 days), no caches, build outputs
# never uploaded. Must stay that way: this workflow is the control plane's
# daily Android/Web perf dispatch.
name: Linux perf bench
"on":
  workflow_dispatch:
    inputs:
      head_ref:
        description: rules_flutter ref to measure
        required: true
        type: string
      platform:
        description: "bench platform: android or web"
        type: choice
        options: [android, web]
      target_loc:
        description: total Dart lines to generate
        default: "500000"
        type: string
      seed:
        description: generator seed
        default: "1"
        type: string
      repeats:
        description: repeats per scenario (medians are over these)
        default: "3"
        type: string
      lockfile:
        description: "measured workspace lockfile: none or a committed MODULE.bazel.lock"
        default: committed
        type: choice
        options: [none, committed]
      bazel_flags:
        description: "extra Bazel flags for the measured workspace (the treatment arm when ab=flags)"
        default: ""
        type: string
      ab:
        description: "off (one run) or flags (same-runner control/treatment A/B of bazel_flags)"
        default: "off"
        type: choice
        options: ["off", flags]
permissions:
  contents: read
jobs:
  bench:
    name: Linux bench
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out bench tooling (this branch)
        uses: actions/checkout@v7
        with:
          path: tools-src
      - name: Enable Linux sandbox user namespaces
        run: tools-src/.github/scripts/enable_linux_sandbox.sh
      - name: Check out rules_flutter at head_ref
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.head_ref }}
          path: rules-head
      # Installs Bazel only (no cache configuration: every build is clean).
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      - name: Validate bazel_flags
        env:
          BAZEL_FLAGS: ${{ inputs.bazel_flags }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools-src/tools/perf/bench_flags.py" \
            --flags="$BAZEL_FLAGS"
      - name: Validate A/B inputs
        env:
          AB: ${{ inputs.ab }}
          BAZEL_FLAGS: ${{ inputs.bazel_flags }}
          LOCKFILE: ${{ inputs.lockfile }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools-src/tools/perf/ab.py" validate \
            --mode sol \
            --ab "$AB" \
            --lockfile "$LOCKFILE" \
            --flags="$BAZEL_FLAGS"
      # The runner's preinstalled Android SDK + NDK, forwarded into
      # repository rules with --repo_env (repository rules never see the
      # client environment otherwise). The NDK is derived at runtime: the
      # image ships several versions side by side and only a versioned
      # directory works. The Web bench needs neither.
      - name: Point Bazel at the runner's Android SDK and NDK
        if: inputs.platform == 'android'
        run: |
          set -euo pipefail
          test -n "$ANDROID_HOME" || { echo "ANDROID_HOME is not set"; exit 1; }
          ndk="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)"
          test -d "$ndk" || { echo "no NDK under $ANDROID_HOME/ndk"; exit 1; }
          echo "build --repo_env=ANDROID_HOME=$ANDROID_HOME" >> ~/.bazelrc
          echo "build --repo_env=ANDROID_NDK_HOME=$ndk" >> ~/.bazelrc
      - name: Generate pristine monorepo
        env:
          SEED: ${{ inputs.seed }}
          TARGET_LOC: ${{ inputs.target_loc }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools-src/tools/perf/gen_monorepo.py" generate \
            --target-loc "$TARGET_LOC" \
            --seed "$SEED" \
            --rules-flutter "$GITHUB_WORKSPACE/rules-head" \
            --out "$RUNNER_TEMP/ws-head-pristine"
      - name: Generate committed lockfile
        # One unmeasured analysis-only build per configuration writes
        # MODULE.bazel.lock into the pristine workspace before measuring.
        # Without this the generated workspace has no lock (lockfile=none).
        if: inputs.lockfile == 'committed'
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          ws="$RUNNER_TEMP/ws-head-pristine"
          out="$RUNNER_TEMP/lock-out"
          target="//app:app_$PLATFORM"
          rm -rf "$out"
          for flags in "-c opt" "-c dbg"; do
            (cd "$ws" && bazel --output_base="$out" build $flags "$target" --nobuild)
          done
          (cd "$ws" && bazel --output_base="$out" shutdown)
          rm -rf "$out"
          test -f "$ws/MODULE.bazel.lock"
      - name: Apply bazel_flags to the measured workspace
        if: inputs.ab == 'off' && inputs.bazel_flags != ''
        env:
          BAZEL_FLAGS: ${{ inputs.bazel_flags }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools-src/tools/perf/bench_flags.py" \
            --flags="$BAZEL_FLAGS" \
            --workspace "$RUNNER_TEMP/ws-head-pristine"
      - name: Prepare A/B workspaces
        # Control and treatment start from the same pristine workspace
        # (committed lockfile included, generated once above); only the
        # treatment copy gets the flags.
        if: inputs.ab == 'flags'
        env:
          BAZEL_FLAGS: ${{ inputs.bazel_flags }}
          LOCKFILE: ${{ inputs.lockfile }}
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/tools-src/tools/perf"
          rm -rf "$RUNNER_TEMP/ws-control-pristine" "$RUNNER_TEMP/ws-treatment-pristine"
          cp -a "$RUNNER_TEMP/ws-head-pristine" "$RUNNER_TEMP/ws-control-pristine"
          cp -a "$RUNNER_TEMP/ws-head-pristine" "$RUNNER_TEMP/ws-treatment-pristine"
          if [ "$LOCKFILE" = "none" ]; then
            rm -f "$RUNNER_TEMP/ws-control-pristine/MODULE.bazel.lock" \
              "$RUNNER_TEMP/ws-treatment-pristine/MODULE.bazel.lock"
          fi
          python3 "$tools/bench_flags.py" \
            --flags="$BAZEL_FLAGS" \
            --workspace "$RUNNER_TEMP/ws-treatment-pristine"
      - name: Measure speed-of-light
        if: inputs.ab == 'off'
        # Both configurations of the selected platform, one repeat at a
        # time: sol.py run resets the workspace from pristine before each
        # config, builds the three scenarios, replays their execution logs
        # and shuts its server down. A failing config is recorded and the
        # loop continues; the step then exits non-zero, but summarize and
        # upload still run.
        env:
          PLATFORM: ${{ inputs.platform }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/tools-src/tools/perf"
          run_sol() {
            python3 "$tools/sol.py" run --tools "$tools" \
              --pristine "$RUNNER_TEMP/ws-head-pristine" \
              --work "$RUNNER_TEMP/sol-run-$rep" \
              --out-base "$RUNNER_TEMP/sol-out-$rep" \
              --results "$GITHUB_WORKSPACE/sol-results" \
              --rep "$rep" \
              "$@"
          }
          failed=0
          for rep in $(seq 1 "$REPEATS"); do
            rm -rf "$RUNNER_TEMP/sol-out-$rep" "$RUNNER_TEMP/sol-run-$rep"
            case "$PLATFORM" in
              android) run_sol --config android_release --config android_debug || failed=1 ;;
              web) run_sol --config web_release --config web_debug || failed=1 ;;
              *) echo "unknown platform: $PLATFORM"; exit 1 ;;
            esac
          done
          exit "$failed"
      - name: Measure A/B
        # ab.py run does one repeat per loop turn, both arms: control
        # first on odd repeats, treatment first on even ones, each arm
        # in its own work directory and output base. A failing arm makes
        # the step exit non-zero; summarize and upload still run.
        if: inputs.ab == 'flags'
        env:
          PLATFORM: ${{ inputs.platform }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/tools-src/tools/perf"
          failed=0
          python3 "$tools/ab.py" run --tools "$tools" \
            --platform "$PLATFORM" \
            --pristine-control "$RUNNER_TEMP/ws-control-pristine" \
            --pristine-treatment "$RUNNER_TEMP/ws-treatment-pristine" \
            --work-root-control "$RUNNER_TEMP/ab-run-control" \
            --work-root-treatment "$RUNNER_TEMP/ab-run-treatment" \
            --out-base-root-control "$RUNNER_TEMP/ab-out-control" \
            --out-base-root-treatment "$RUNNER_TEMP/ab-out-treatment" \
            --results "$GITHUB_WORKSPACE/ab-results" \
            --repeats "$REPEATS" \
            || failed=1
          exit "$failed"
      - name: Summarize speed-of-light
        # Runs even when measuring failed, so <platform>-sol.json (with the
        # finished flows and the recorded reasons) is always written.
        if: ${{ !cancelled() && inputs.ab == 'off' }}
        env:
          LOCKFILE: ${{ inputs.lockfile }}
          PLATFORM: ${{ inputs.platform }}
          REPEATS: ${{ inputs.repeats }}
          SEED: ${{ inputs.seed }}
          TARGET_LOC: ${{ inputs.target_loc }}
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/tools-src/tools/perf"
          sha="$(git -C "$GITHUB_WORKSPACE/rules-head" rev-parse HEAD)"
          python3 "$tools/sol.py" summarize \
            --results "$GITHUB_WORKSPACE/sol-results" \
            --sha "$sha" \
            --repeats "$REPEATS" \
            --target-loc "$TARGET_LOC" \
            --seed "$SEED" \
            --lockfile "$LOCKFILE" \
            --out "$GITHUB_WORKSPACE/$PLATFORM-sol.json"
          {
            echo '```json'
            cat "$GITHUB_WORKSPACE/$PLATFORM-sol.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize A/B
        # Runs even when an arm failed, so <platform>-ab.json (with the
        # finished flows and the recorded reasons) is always written.
        if: ${{ !cancelled() && inputs.ab == 'flags' }}
        env:
          AB: ${{ inputs.ab }}
          BAZEL_FLAGS: ${{ inputs.bazel_flags }}
          LOCKFILE: ${{ inputs.lockfile }}
          PLATFORM: ${{ inputs.platform }}
          REPEATS: ${{ inputs.repeats }}
          SEED: ${{ inputs.seed }}
          TARGET_LOC: ${{ inputs.target_loc }}
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/tools-src/tools/perf"
          sha="$(git -C "$GITHUB_WORKSPACE/rules-head" rev-parse HEAD)"
          python3 "$tools/ab.py" summarize \
            --platform "$PLATFORM" \
            --results "$GITHUB_WORKSPACE/ab-results" \
            --sha "$sha" \
            --repeats "$REPEATS" \
            --target-loc "$TARGET_LOC" \
            --seed "$SEED" \
            --ab "$AB" \
            --bazel-flags="$BAZEL_FLAGS" \
            --lockfile "$LOCKFILE" \
            --out "$GITHUB_WORKSPACE/$PLATFORM-ab.json"
          {
            echo '```json'
            cat "$GITHUB_WORKSPACE/$PLATFORM-ab.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload platform sol
        # Runs even when measuring failed: the artifact explains the run.
        # Only the small result file is uploaded, never a build output.
        # Single-run (ab=off) only; A/B runs upload <platform>-ab instead.
        if: ${{ !cancelled() && inputs.head_ref != '' && inputs.ab == 'off' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-sol
          path: ${{ inputs.platform }}-sol.json
          retention-days: 3
      - name: Upload platform ab
        # Runs even when an arm failed: the artifact explains the run.
        if: ${{ !cancelled() && inputs.ab == 'flags' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-ab
          path: ${{ inputs.platform }}-ab.json
          retention-days: 3
      - name: Upload platform profile
        # Small profile companion to <platform>-sol / <platform>-ab: the
        # gzipped Bazel trace profiles and execution logs behind each
        # flow's profile record, both arms of an A/B run kept apart. No
        # build outputs.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-profile
          path: |
            sol-results/**/trace.json.gz
            sol-results/**/execlog.json.gz
            ab-results/control/**/trace.json.gz
            ab-results/control/**/execlog.json.gz
            ab-results/treatment/**/trace.json.gz
            ab-results/treatment/**/execlog.json.gz
          retention-days: 3
