# Full-matrix workflow for rules_flutter ("pre-release").
#
# Runs the complete macOS e2e coverage that push CI (ci.yaml) no longer runs:
# every workspace's full `bazel test //...` on macOS. Linux and Windows
# coverage lives in push CI. Triggered by release tags, weekly, or manually;
# the release workflow waits for this workflow to pass on the tagged commit
# (see the gate job in release.yaml) before publishing.
#
# Disk caches are the push-CI shards' keys below, restored only (except the
# plugin job, which owns its key and re-saves it on pushes and schedules so
# tag runs hit it). See ci.yaml for why saves delete the key first.
permissions:
  actions: write
  contents: read
name: Full
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
concurrency:
  # No cancel-in-progress: a run gating a release must not be cancelled by a
  # newer trigger.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
env:
  BAZEL_REPOSITORY_CACHE_KEY_FILES: |
    - MODULE.bazel
    - MODULE.bazel.lock
    - e2e/*/MODULE.bazel
    - flutter/private/versions.bzl
jobs:
  e2e-macos:
    name: E2E full (${{ matrix.workspace }}, macos-latest)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      # At most 2 of the 5 macOS slots shared with rules_dart, so a push run's
      # macOS jobs (2) and rules_dart's (1) still get slots while this runs.
      max-parallel: 2
      matrix:
        include:
          # shard names the push-CI disk keys of the same content; only the
          # plugin job saves (its own key).
          - workspace: smoke
            shard: macos-b
            cache-save: false
          - workspace: dual_hub
            shard: none
            cache-save: false
          - workspace: hello_world
            shard: macos-a
            cache-save: false
          - workspace: ffi_example
            shard: none
            cache-save: false
          - workspace: plugin_example
            shard: macos-plugin
            cache-save: true
          - workspace: ffi_plugin_example
            shard: none
            cache-save: false
          - workspace: codegen
            shard: none
            cache-save: false
    env:
      DISK_CACHE_DIR: ~/.cache/bazel-disk
    steps:
      - uses: actions/checkout@v7
      - name: Set disk cache key
        run: echo "DISK_CACHE_KEY=ff-disk-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'e2e/*/MODULE.bazel', 'flutter/private/versions.bzl') }}" >> "$GITHUB_ENV"
      # The repository cache is shared per OS with push CI (same key files).
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          repository-cache: ${{ env.BAZEL_REPOSITORY_CACHE_KEY_FILES }}
          cache-save: ${{ matrix['cache-save'] && (github.event_name == 'push' || github.event_name == 'schedule') }}
      # Workspaces with shard `none` have no push-CI macOS content and rebuild
      # from the repository cache; the rest restore their push shard's key.
      - name: Restore disk cache
        if: matrix.shard != 'none'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
          restore-keys: ff-disk-${{ runner.os }}-${{ matrix.shard }}-
      - name: Point Bazel at the disk cache
        if: matrix.shard != 'none'
        run: |
          dir="${{ env.DISK_CACHE_DIR }}"
          case "$dir" in "~"*) dir="$HOME${dir#\~}";; esac
          mkdir -p "$dir"
          echo "build --disk_cache=$dir" >> ~/.bazelrc
      # --test_output=errors so a failure's assertion reaches this log. Without
      # it the output stays in a test.log on the runner and is discarded with
      # the machine.
      - name: bazel test //... (e2e/${{ matrix.workspace }})
        working-directory: e2e/${{ matrix.workspace }}
        run: bazel test //... --test_output=errors
      - name: Report cache sizes
        if: always()
        run: du -sh ~/.cache/bazel-disk ~/.cache/bazel-repo 2>/dev/null || true
      - name: Delete stale disk cache key
        if: always() && matrix['cache-save'] && (github.event_name == 'push' || github.event_name == 'schedule')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100" --jq ".actions_caches[] | select(.key == \"$DISK_CACHE_KEY\" and .ref == \"${{ github.ref }}\") | .id" || true)
          for id in $ids; do gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null || true; done
      - name: Save disk cache
        if: always() && matrix['cache-save'] && (github.event_name == 'push' || github.event_name == 'schedule')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DISK_CACHE_DIR }}
          key: ${{ env.DISK_CACHE_KEY }}
  conclusion:
    name: Conclusion
    needs: [e2e-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        run: echo '${{ toJSON(needs) }}' | jq -e 'with_entries(select(.value.result != "success" and .value.result != "skipped")) | length == 0'
